server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Handles YouTube playback (core Lavalink dropped built-in YouTube support).
    # Actively maintained to keep up with YouTube's anti-bot changes — check
    # https://github.com/lavalink-devs/youtube-source/releases for the latest version.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.3"
      repository: "https://maven.lavalink.dev/releases"
    # Spotify plugin (lavasrc) removed to save memory on limited RAM plans.
    # SoundCloud below is Lavalink's own native source, no extra plugin needed.

  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false # handled by the youtube-source plugin instead
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    trackStuckThresholdMs: 10000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    opusEncodingQuality: 10
    resamplingQuality: LOW

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 3
